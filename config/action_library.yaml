# =============================================================================
# 施策ライブラリ（仕様書 §10-2）と WS 用の問い（§6-3-1）
# テーマは comment_themes.yaml のテーマ名、および category_theme_map で設問カテゴリと接続する。
# =============================================================================
themes:
  業務量・人員配置:
    check: [繁忙時期, 業務の偏在, 属人化, 欠員]
    actions: [業務棚卸, 繁閑の共有, 配置見直し, 業務の標準化]
    level: {全庁: 人員配置・定員管理, 部局: 業務配分の見直し, 課: 業務棚卸と繁閑共有}
  上司・マネジメント:
    check: [1on1の頻度, 指示の明確さ, フィードバックの有無]
    actions: [1on1の導入, 期待役割の共有, 評価者研修, フィードバック機会の設計]
    level: {全庁: 管理職研修・評価者研修, 部局: 育成方針の共有, 課: 1on1・期待役割の明確化}
  キャリア・成長:
    check: [異動希望の把握, 成長機会, 将来像の共有]
    actions: [キャリア面談, 庁内公募, 研修機会の拡充, ジョブローテーション設計]
    level: {全庁: キャリア制度・公募・研修, 部局: 育成ローテーション, 課: 成長目標の対話}
  評価・処遇:
    check: [評価基準の理解, 評価の説明, 納得感]
    actions: [期初の基準説明, 評価面談の充実, 評価調整の透明化, 制度の周知]
    level: {全庁: 評価制度の見直し・周知, 部局: 評価調整の運用, 課: 期初・期末面談の質}
  組織連携:
    check: [課間の壁, 情報共有, 会議の運営]
    actions: [横断会議, ナレッジ共有, 役割の整理]
    level: {全庁: 横断体制・情報基盤, 部局: 部局内連携の場, 課: 情報共有ルール}
  職場環境:
    check: [設備, ITツール, 柔軟な働き方の運用]
    actions: [システム改善, 設備改善, テレワーク等の運用整備]
    level: {全庁: 基盤システム・働き方制度, 部局: 運用ルール, 課: 環境改善の要望整理}
  組織風土:
    check: [称賛・承認の機会, 意見を言える場, 失敗への向き合い方]
    actions: [称賛・承認の仕組み, 意見交換の場, 改善対話の定例化]
    level: {全庁: 風土醸成の方針, 部局: 部局内の対話機会, 課: 称賛・フィードバックの習慣化}
  福利厚生:
    check: [制度の認知, 利用しやすさ]
    actions: [制度周知, 利用促進, 制度の見直し]
    level: {全庁: 制度見直し・周知, 部局: 利用促進, 課: 情報提供}

# 設問カテゴリ → 施策テーマ（自治体ごとに client.yaml の analysis.category_theme_map で上書き可）
category_theme_map:
  仕事内容について: キャリア・成長
  現在の成長について: キャリア・成長
  今後の目標やビジョンについて: キャリア・成長
  仕事の環境について: 職場環境
  上司について: 上司・マネジメント
  組織風土について: 組織風土
  業務負荷について: 業務量・人員配置
  福利厚生について: 福利厚生
  組織運営について: 組織連携
  人事施策について: キャリア・成長
  人事評価について: 評価・処遇
  総合的な質問: null

ws_questions:
  - この結果は、普段感じている職場の状態と合っているか。
  - なぜこのような結果になっていると考えるか。具体的な事実・場面は何か。
  - 既に実施している取り組みは何か。効果が出ている／出ていない理由は何か。
  - 課として3〜6か月で変えられることは何か。
  - 部局・人事・全庁に支援してほしいことは何か。

horizon:
  短期: 現場運用で3〜6か月以内に着手可能
  中期: 部局・人事連携で6〜18か月
  長期: 制度・組織体制・人員計画等、18か月以上
