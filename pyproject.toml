[project]
name = "caqnal-report"
version = "0.1.0"
description = "CAQNAL 自治体エンゲージメント調査 分析レポート量産パイプライン"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "pyyaml>=6.0",
  "pillow>=10",
  "scikit-learn>=1.5",
]

[project.scripts]
caqnal = "caqnal_report.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caqnal_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
