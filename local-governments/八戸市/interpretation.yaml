# これは AI の下書き（2026-10-13）。数値は run R8_20261013-214149 の公開データ（全庁、n=984）から引いた。
# 担当者が確認して直し、確認したら status を confirmed にし、confirmed_by / confirmed_on を記入する。
# それまでレポートの表紙に「下書き」と出て、verify は納品版にしない。
#
# 書き方の約束（仕様 v2・プロンプト集 3／4）
#   観測事実（数値と n）→ 背景の仮説 → 実施案 → 実施条件 の順。仮説には（仮説）、施策には〔協議案〕を付ける
#   相関・β・分岐を原因や施策の効果、必要な増員人数として書かない。現行運用は資料で確認できるまで断定しない
#
# 確認してほしい点（下書き時に気づいたこと）
#   1. Q52「現在の人事評価制度をアップデートする必要があると感じる」は文言が否定方向なのに逆転の設定が無い。
#      今は「そう思う＝高い点」で集計しており 30.9 点（肯定 10.1%）＝「必要と感じる人は少ない」と読める。
#      意図どおりか（逆転すべきか）を questions.yaml で確認する。下の文章は Q52 に依存しないように書いた
#   2. 八戸市の人材育成基本方針など方針資料の名称・改定日・頁が未入手（sources が空）。方針との対応は未記載
#   3. 職員の声（comments）は書いていない。自由記述の原文を人が読んで分類・要約する必要がある
#   4. 部局長版の部局ごとの示唆（readers.部局長_<部局名>.insights）は書いていない。部局の業務を知る担当者が書く
