# =============================================================================
# 自由記述のテーマ分類 キーワード辞書（仕様書 §4-8-2、ルールベース）
# 1コメントに複数テーマ可。どれにも当たらなければ「その他」。
# LLM 分類に置き換える場合も、この辞書はフォールバック・QA 用に残す。
# =============================================================================
themes:
  業務量・人員配置: [人手, 人員, 業務量, 残業, 忙し, 負担, 欠員, 定員, 増員, 削減, 時間外, 繁忙, 人が足りない, 人数, 配置, 兼務]
  上司・マネジメント: [上司, 管理職, 課長, 部長, 係長, マネジメント, 指示, 面談, 1on1, リーダー, 所属長]
  キャリア・成長: [キャリア, 成長, 研修, スキル, 異動, 昇任, 昇進, ローテーション, 育成, 学ぶ, 専門性, 目標]
  評価・処遇: [評価, 人事評価, 給与, 給料, 手当, 昇給, 処遇, 賞与, 待遇, 昇格, 公平, 納得]
  組織風土: [風土, 雰囲気, 意見, 相談, 人間関係, ハラスメント, 称賛, 褒め, 挑戦, 前例, 風通し, コミュニケーション, 対話]
  組織連携: [連携, 部署間, 縦割り, 情報共有, 会議, 調整, 他部署, 引き継ぎ, 横断]
  職場環境: [環境, 設備, パソコン, PC, システム, DX, デジタル, テレワーク, 在宅, 庁舎, 机, 空調, ツール, 端末, ネットワーク]
  ワークライフバランス: [休暇, 有給, 年休, 育児, 介護, ワークライフ, 家庭, 子育て, 休み, プライベート]
  福利厚生: [福利厚生, 互助会, 健康, メンタル, ストレス, 手当]
  制度・手続き: [制度, 手続き, 申請, 書類, 押印, 決裁, 煩雑, 効率, 無駄, 事務]

tone:                       # 簡易トーン判定（断定的な感情推定は避ける。集計上の参考値）
  positive: [満足, 良い, 助かって, 感謝, ありがたい, 働きやすい, 充実, 恵まれ]
  negative: [不満, 不足, 改善, 見直し, 難しい, つらい, 辛い, 厳しい, 疲れ, 限界, 悪い, 不公平, 非効率]

masking:                    # 個人特定情報の簡易マスキング（正規表現）。氏名は辞書化できないため、納品前に人手確認する
  patterns:
    - {name: email, regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", replace: "[メール]"}
    - {name: phone, regex: "0\\d{1,4}-\\d{1,4}-\\d{3,4}", replace: "[電話]"}
    - {name: number, regex: "\\d{5,}", replace: "[数字]"}
    - {name: person, regex: "[一-龥]{1,4}(さん|氏|課長|部長|係長|主任|主事)", replace: "[個人]"}
