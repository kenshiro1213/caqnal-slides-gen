    経験者の視点を業務改善の場で活かす余地がある（仮説）。

summary_state:
  - theme: 評価と人事施策への納得
    fact: 人事施策 48.5 点・人事評価 51.7 点。Q49 声の反映 40.9 点、Q54 評価基準の明確さ 41.8 点（n＝984）
    insight: 制度があることより、基準と決定の理由が職員に届いていない可能性（仮説）。現行の運用は確認が必要
    direction: 評価基準と人事施策の決定理由を、既存の面談・庁内周知の場で説明する〔協議案〕
  - theme: 将来の見通し
    fact: 今後の目標やビジョン 53.8 点、Q23 5 年後の姿 47.5 点。Q21 は推奨・継続の決定木で上位の分かれ目
    insight: 仕事の手応えはあるが、それが自分の将来につながる見通しを持ちにくい（仮説）
    direction: 配属・異動の理由と次の経験を本人と話す機会を、既存の面談に組み込む〔協議案〕
  - theme: 中堅層の状態
    fact: 30 代 満足 59.7 点、勤続 10〜20 年 満足 59.1 点（3 年未満は 74.0 点）
    insight: 役割と業務が重なる時期に、負担と見通しの課題が集まっている可能性（仮説。属性の重なりは未統制）
    direction: 中堅層の業務量・役割の確認と、キャリアの対話を優先する〔協議案〕

policy:
  title: 仕事の手応えを、将来の見通しと納得できる人事運用につなげる
  message: 職場の強み（役割の理解・相談できる関係）を土台に、評価・配置・人事施策の「理由」と「見通し」を職員に届ける
  pillars:
    - title: 理由を伝える人事運用
      text: 評価基準、異動・配属、人事施策の決定理由を、職員が受け取れる形で説明する。制度の追加より先に、既存の制度の説明と運用をそろえる。
    - title: 将来の見通しを本人と話す
      text: 面談の中で、いまの仕事が何につながるか、次に経験する仕事は何かを話す。異動希望の全面実現は約束しない。
    - title: 中堅層の負荷と役割を見直す
      text: 30 代・勤続 10〜20 年の層で、業務量と役割の重なりを確認し、やめる・減らす仕事と支援者を決める。
  insight: >-
    満足・推奨・継続のいずれでも、人事施策・今後の目標やビジョン・現在の成長が相関の上位にあり点数は低い。
    3 つの柱はこの共通の論点に対応する。どの柱も効果は未確認のため、少数の職場で試して判断する。
  note: 協議案。八戸市の人材育成基本方針など方針資料との対応は未確認（資料の名称・改定日・頁を確認してから記載する）。

measures:
  - title: 評価のフィードバックで「理由」と「次の一歩」を伝える
    message: 既存の評価面談の中で、評価の根拠と、次期に期待する行動を具体的に伝える
    evidence:
      - Q54 評価基準の明確さ 41.8 点、人事評価カテゴリ 51.7 点（n＝984）
      - 人事評価に関する決定木・相関は参考扱い。施策の効果は未確認
      - 示唆：基準が無いのではなく、面談で伝わっていない可能性（仮説）
    actions:
      - 評価者向けに、根拠と期待行動を伝える面談メモの様式を 1 枚用意する
      - 期初・期末の既存面談でその様式を使う（新しい面談は増やさない）
    owners:
      - 人事課：様式と評価者への説明
      - 所属長：面談での実施
      - 確認事項：現行の評価面談の時期・回数（資料で確認）
    trial:
      - 2〜3 部局で 1 期試行
      - 工数の仮定：評価者 1 人あたり面談 1 回につき追加 10 分程度（仮置き）
      - 拡大の条件：試行部局で Q54 の否定割合が下がり、評価者の負担が許容範囲
    note: 協議案。現行の評価制度・面談の運用は未確認のため、確認後に内容を調整する。
  - title: 配属・異動の理由と次の経験を本人と共有する
    message: 異動の内示や面談の際に、配属の理由と、そこで得てほしい経験を伝える
    evidence:
      - 今後の目標やビジョン 53.8 点、Q23 5 年後の姿 47.5 点、Q53 配属先が成長につながる感覚は満足と r＝0.517
      - 示唆：仕事の手応えを将来につなげる説明が不足している可能性（仮説）
    actions:
      - 異動時に所属長が配属の理由と期待する経験を本人に伝える
      - 自己申告の内容を面談で確認し、次の経験の候補を話す
    owners:
      - 人事課：伝え方の目安と自己申告の運用
      - 所属長：本人との対話
    trial:
      - 次回の定期異動で希望部局を対象に試行
      - 工数の仮定：所属長 1 人あたり異動者 1 人につき 15 分程度（仮置き）
      - 見直しの条件：本人の受け止め（短い振り返り）で理解が進まない場合は伝え方を修正
    note: 協議案。異動希望の全面的な実現は約束しない。現行の自己申告制度の運用は未確認。
  - title: 中堅層の業務量と役割を棚卸しする
    message: 30 代・勤続 10〜20 年の層が多い職場で、やめる・減らす仕事と支援者を決める
    evidence:
      - 30 代 満足 59.7 点、勤続 10〜20 年 満足 59.1 点。Q42 精神的な余裕は推奨の重回帰で β＝0.119
      - 示唆：役割の重なりと業務量が課題になっている可能性（仮説。属性の重なりは未統制）
    actions:
      - 所属内で中堅職員の担当業務を一覧にし、停止・簡素化・分担の候補を 1 つ以上決める
      - 指導役を兼ねる職員の時間を確保する
    owners:
      - 所属長：棚卸しと分担の決定
      - 部局長：課をまたぐ応援の調整
      - 人事課：棚卸しの様式の提供
    trial:
      - 希望する 3 職場で 90 日試行
      - 工数の仮定：所属内の打合せ 2 回（各 1 時間）
      - 中止の条件：棚卸しが負担を増やすだけで停止・簡素化が決まらない場合
    note: 協議案。調査結果だけから必要な増員人数は算出しない。

kpis:
  - area: 評価のフィードバック
    practice: 試行部局で様式を使った面談の実施率と、面談後の職員の受け止め（短い振り返り）
    judge: 評価者の追加時間と、面談で根拠を伝えられたかの自己確認
    survey: Q54・Q49・人事評価カテゴリ
  - area: 配属と次の経験
    practice: 異動者のうち理由と期待する経験を伝えられた割合
    judge: 本人の理解の振り返り、所属長の負担
    survey: Q21・Q23・Q53・今後の目標やビジョン
  - area: 中堅層の業務量
    practice: 停止・簡素化・分担を決めた業務の数と、実際に減った時間
    judge: 対象職員の負担感の変化（聞き取り）
    survey: Q42・業務負荷カテゴリ・30 代と勤続 10〜20 年の 3 指標

