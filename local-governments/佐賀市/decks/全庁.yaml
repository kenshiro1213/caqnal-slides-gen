# =============================================================================
# 佐賀市 全庁分析レポート スライド構成
# 標準（config/decks/全庁.yaml）から、入力データに無い章を除いた版:
#   - 部局分析（所属設問なし） - 属性分析（属性設問なし） - 自由記述分析（自由記述設問なし）
#   - 経年スライド（trend_ranking / quadrant_yoy / org_heatmap diff_yoy）は初回調査のため除外
# 属性・所属列が回答 CSV に付与されたら client.yaml の deck_overrides を外して標準構成に戻す。
# =============================================================================
name: 全庁分析レポート
filename: "{client}_{fy}_全庁分析レポート.pptx"
slides:
  - type: cover
  - type: toc
  - {type: section, no: 0, title: Executive Summary}
  - type: exec_onepage                                   # T01
  - {type: section, no: 1, title: 調査概要・結果の読み方}
  - type: survey_overview
  - type: reading_guide
  - {type: section, no: 2, title: 全庁結果}
  - type: overall_kpi                                    # T02
  - {type: category_result, unit_type: 軸, title: "働きがい・働きやすさ（軸別）"}      # T03
  - {type: category_result, unit_type: カテゴリ}                                    # T03
  - {type: question_ranking, kind: 高評価}               # T04
  - {type: question_ranking, kind: 低評価}               # T04
  - type: dispersion                                     # 平均×SD
  - {type: section, no: 3, title: 職員タイプ分析}
  - type: segment_overview                               # T08
  - type: segment_drivers                                # T08
  - {type: section, no: 4, title: Key Driver 分析}
  - type: kd_correlation                                 # T09
  - type: kd_regression                                  # T09
  - type: kd_impact_score                                # T09
  - {type: section, no: 5, title: 分析の総括}
  - type: synthesis                                      # T14
  - type: priority_issues                                # 重点課題候補（6観点シグナル）
  - {type: section, no: 6, title: 施策の方向性}
  - type: actions                                        # T15
  - {type: section, title: APPENDIX, layout: appendix}
  - {type: question_list, part: 1}
  - {type: question_list, part: 2}
  - type: method_notes
