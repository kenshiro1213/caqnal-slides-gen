# 部局長向け（全 18 部局共通の文章）。部局ごとの示唆は readers.部局長_<部局名>.insights に書く
unit_readers:
  policy:
    title: 部局の強みを残し、課ごとの負担と見通しの違いに手を打つ
    message: 全庁の課題（評価・将来の見通し・中堅層の負荷）を、部局の業務と課の状態に置き換えて考える
    pillars:
      - title: 課ごとの違いを確かめる
        text: 課の点数を課長の評価や順位に使わず、業務の繁閑・職員構成の違いとして課長と確認する。
      - title: 仕事と応援を配分する
        text: 部局でやめる・減らす仕事を決め、課をまたぐ応援と指導役の時間を確保する。
      - title: 人事・全庁へ上げる論点を分ける
        text: 評価制度・配置・人員など部局で決められない論点は、根拠を添えて人事課へ相談する。
    insight: 全庁の分析では、評価・人事施策・将来の見通しが 3 指標に共通する論点だった。部局で動かせる部分と、全庁で扱う部分を分けて進める。
    note: 協議案。部局の業務の状況は担当者と部局長で確認する。
  measures:
    - title: 部局会議で課ごとの結果と支援を話す
      message: 既存の部局会議で、課ごとの強みと課題、必要な支援を確認する
      evidence:
        - 全庁では人事施策・人事評価・今後の目標やビジョンが低い（48.5〜53.8 点）
        - 部局の結果は本資料のサマリーとカテゴリの頁を参照
      actions:
        - 課長が自課の結果から重点を 1 つ選び、部局会議で共有する
        - 部局長が課をまたぐ応援・業務の停止の判断をする
      owners:
        - 部局長：判断と調整
        - 課長：自課の重点と行動
        - 人事課：全庁の論点の受け付け
      trial:
        - 90 日で 1 回振り返り
        - 工数の仮定：部局会議 1 回あたり 30 分を充てる（仮置き）
      note: 協議案。課の得点を課長の評価や順位に使わない。

