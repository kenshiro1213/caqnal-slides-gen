    設問では Q18 市の発展に貢献したい（r＝0.529）、Q21 仕事が将来につながる感覚（0.517）、Q16 成長の見込み（0.497）が上位。
    公共への貢献意識が継続を支えており、その意識を将来の仕事の見通しにつなげられるかが論点（仮説）。
  "ols:category:satisfaction": >-
