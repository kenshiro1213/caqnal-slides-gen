    検証 R²＝0.472（平均だけの予測より誤差 15.0 点 対 21.8 点）。係数は改善幅ではないため、施策の順位付けには使わない。
  "ols:question:satisfaction": >-
    設問を同時に入れると Q18 市の発展への貢献意識（β＝0.211）、Q7 仕事の意義（0.157）、Q45 福利厚生への満足（0.149）に関連が残る。
    似た設問が多く個々の係数は入れ替わりやすいので、上位の顔ぶれを「仕事の意味」「処遇」のまとまりとして読む。
  "ols:category:recommend": >-
    今後の目標やビジョン（β＝0.202）、福利厚生（0.159）、人事施策（0.148）に関連が残る。
    推奨は組織の方向性と処遇・人事の仕組みへの見方を同時に反映している（仮説）。
  "ols:question:recommend": >-
    Q18 市の発展への貢献意識（β＝0.153）、Q42 精神的な余裕（0.119）、Q44 互助会の福利厚生（0.101）に関連が残る。
    余裕の無さが「人に勧めにくさ」と結びついている可能性があり、業務量の確認とあわせて読む（仮説）。
  "ols:category:retention": >-
    今後の目標やビジョン（β＝0.232）が最も大きく、福利厚生（0.109）が続く。
    継続の意向は、組織と自分の将来像が描けるかと最も関わる（仮説）。
  "ols:question:retention": >-
    Q18 市の発展への貢献意識（β＝0.316）が突出し、Q45 福利厚生への満足（0.149）、Q7 仕事の意義（0.148）が続く。
    貢献意識の高い職員が多い強みを、役割と将来の見通しの説明で支える方向が考えられる（仮説）。
  "tree:satisfaction": >-
    最初の分かれ目は Q7 仕事の意義（回答 3 以下の 291 名は平均 47.3 点、4 以上の 693 名は 73.3 点）。
    意義を感じにくく、声が人事施策に反映されないと強く感じる群（Q49 が 1、102 名）は 31.4 点。
    再抽出で根元が同じになるのは 47% のため「参考」。閾値は配置や評価の基準にしない。
  "tree:recommend": >-
    最初の分かれ目は Q21 仕事が将来につながる感覚（回答 2 以下の 294 名は平均 28.5 点）。
    そのうち声が反映されないと強く感じる群（Q49 が 1、115 名）は 15.9 点。根元の再現は 44% で「参考」。
  "tree:retention": >-
    最初の分かれ目は Q18 市の発展への貢献意識（回答 3 以下の 304 名は平均 46.1 点）。
    貢献意識と将来の見通し（Q21）の両方が高い 352 名は 83.0 点。根元の再現は 93% で比較的安定（採用候補）。
  "attribute_indicators:年代": >-
    30 代が 3 指標とも最も低い（満足 59.7・推奨 43.6・継続 62.1 点）。10・20 代と 60 代以上は高い。
    係長前後の役割と業務が重なる時期に、負担と将来の見通しの課題が集まっている可能性がある（仮説。属性の重なりは未統制）。
