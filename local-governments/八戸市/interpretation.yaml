    人事施策は点数が最も低いカテゴリでもあり、満足に関わる論点の候補（効果の大きさを示すものではない）。
  "kd_category:recommend": >-
    推奨との相関は人事施策（r＝0.539）、今後の目標やビジョン（0.495）、現在の成長（0.484）が上位。
    職場を勧められるかは、日々の仕事より組織の方向性と人事の運用への納得と一緒に動いている（仮説）。
  "kd_category:retention": >-
    継続との相関は今後の目標やビジョン（r＝0.526）、現在の成長（0.511）、人事施策（0.507）が上位。
    市で働き続けたいかは、将来の見通しと成長の実感と強く結びついている（仮説）。
  "kd_question:satisfaction": >-
    設問では Q7 仕事の意義（r＝0.541）、Q21 仕事が将来につながる感覚（0.534）、Q53 配属先が成長につながる感覚（0.517）が上位。
    仕事そのものの意味づけと、配属・キャリアの見通しの両方が満足と関わる。
  "kd_question:recommend": >-
