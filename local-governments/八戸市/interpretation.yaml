insights:
  summary_results: >-
    満足 65.6 点・継続 66.3 点に対し、推奨は 47.8 点（肯定 33.3%）と低い。
    仕事内容・上司・仕事の環境（65.7〜68.2 点）は相対的に高く、人事施策 48.5 点・人事評価 51.7 点・
    福利厚生 52.8 点・今後の目標やビジョン 53.8 点が低い。日々の仕事と上司との関係は支えになっている一方、
    評価・配置・人事施策といった全庁の仕組みへの納得が弱い可能性がある（仮説）。
  summary_state_message: 職場の仕事と上司は支えになっているが、評価・将来の見通し・人事施策への納得が弱い（仮説）
  indicator_distribution: >-
    満足・継続は肯定が約 6 割、否定は 14% 前後。推奨は肯定 33.3%・中立 32.0%・否定 34.7% とほぼ三分され、
    職場を人に勧める段階には至っていない。推奨は職場外からの見え方を含む指標なので、満足と同じ水準を目標にせず、
    次回調査で否定の割合が減るかを見る。
  category_scores: >-
    人事施策・人事評価・福利厚生・今後の目標やビジョンの 4 カテゴリが 48〜54 点で、他の 7 カテゴリ（58〜68 点）と差がある。
    上司・仕事の環境など職場単位で決まりやすい項目より、全庁の制度と運用で決まる項目が低い。
    人事所管が扱う論点が多く、所属長の努力だけでは動きにくい（仮説）。
  question_strengths: >-
    強みは役割の理解（Q8 77.0 点）、所属の業務の理解（Q47 77.0 点）、困ったときに相談できる環境（Q26 76.2 点）。
    課題は職員の声の人事施策への反映（Q49 40.9 点）、評価基準の明確さ（Q54 41.8 点）、5 年後の姿（Q23 47.5 点）。
    職場の中の連携はできており、課題は「組織としての説明と見通し」に集まっている（仮説）。
  kd_category_matrix: >-
    3 指標のいずれでも、人事施策・今後の目標やビジョン・現在の成長が相関の上位に入り、しかも点数は相対的に低い。
    指標ごとに別の施策を立てるより、この 3 つを全庁共通の論点として扱う候補になる。相関は原因を示さないため、
    職場での聞き取りで背景を確かめてから施策を選ぶ。
